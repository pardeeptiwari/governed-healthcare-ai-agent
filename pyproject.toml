[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "member-services"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=0.6,<2", "langsmith>=0.3,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "rank-bm25==0.2.2", "typing-extensions>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
lint = ["ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
member-evaluate = "member_services.evaluate:main"

